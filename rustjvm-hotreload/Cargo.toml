[package]
name = "rustjvm-hotreload"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "LiveRust: differential recompilation and atomic hot-swap of Java methods"

[dependencies]
arc-swap = "1.9.2"
notify = "8.2.0"
notify-debouncer-mini = "0.7.0"
rustjvm-compiler = { version = "0.1.0", path = "../rustjvm-compiler" }
rustjvm-runtime = { version = "0.1.0", path = "../rustjvm-runtime" }
tracing = "0.1.44"

[dev-dependencies]
tempfile = "3.27.0"
tokio = { version = "1.53.1", features = ["full"] }
